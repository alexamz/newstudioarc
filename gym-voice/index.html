<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><meta name="apple-mobile-web-app-capable" content="yes"><title>Gym Voice · POC</title><link rel="manifest" href="./manifest.webmanifest">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b101b;color:#eef3ff}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.app{max-width:630px;margin:auto;min-height:100vh;padding:22px 16px 100px}header{display:flex;gap:12px;align-items:center;padding:8px 0 20px}header b{font-size:22px;letter-spacing:-.6px}header small{display:block;color:#94a2bc;font-size:12px;margin-top:2px}.mark{width:40px;height:40px;background:linear-gradient(150deg,#5f86ff,#72e4c8);border-radius:13px;display:grid;place-items:center;color:#101728;font-weight:900;font-size:23px}.pill{margin-left:auto;font-size:11px;border:1px solid #385158;color:#9ae9cb;padding:6px 9px;border-radius:100px}h1{font-size:27px;letter-spacing:-1px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}p{line-height:1.45}.muted{color:#9cabc4}.small{font-size:13px}.card{border:1px solid #283347;background:#151e2e;border-radius:18px;padding:17px;margin:15px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.modes button,.secondary{background:#1e2c40;color:#dce8ff;border:1px solid #344663;border-radius:11px;padding:12px}.modes button.on{border-color:#79b7ff;color:#fff;background:#293e60}.primary{background:#80b1ff;border:0;color:#091728;border-radius:12px;padding:13px 17px;font-weight:750}.wide{width:100%}textarea,input{background:#101827;border:1px solid #35445b;border-radius:10px;color:#fff;padding:12px;outline-color:#81b4ff}textarea{display:block;min-height:115px;width:100%;resize:vertical}input{width:100%;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}label{display:block;font-size:12px;color:#afbed6;margin:8px 0 5px}.set{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;margin:8px 0}.set input{padding:9px 7px}.warning{color:#ffca88;background:#34291d;padding:9px 11px;border-radius:9px;font-size:12px;margin:7px 0}.okay{color:#abf8d7;font-size:13px}.nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111a2af5;border-top:1px solid #29364e;padding:9px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));justify-content:center;gap:7px;z-index:2}.nav button{border:0;border-radius:11px;padding:10px 20px;color:#adbad0;background:transparent}.nav button.on{background:#2a3b5c;color:#fff}.hr{height:1px;background:#2c374b;margin:18px 0}.entry{border-bottom:1px solid #304056;padding:10px 0}.entry:last-child{border:0}.bad{color:#ffce8e}a{color:#a3c9ff;overflow-wrap:anywhere}.tiny{font-size:11px;color:#8d9db7}.bar{height:7px;border-radius:5px;background:#75bcff;margin:6px 0 13px}.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#274b63;padding:12px 18px;border-radius:12px;z-index:4;max-width:90%;display:none}.check{display:flex;gap:8px;align-items:center;color:#e5eaf4;font-size:13px}.check input{width:auto}.empty{padding:20px;text-align:center;color:#8494b0;border:1px dashed #30435e;border-radius:12px}.heading{margin-top:18px}@media(min-width:660px){.nav{max-width:630px;margin:auto}}
</style></head>
<body><div class="app"><header><div class="mark">G</div><div><b>Gym Voice</b><small>Entrena. Habla. Progresa.</small></div><span class="pill">POC local</span></header><main id="screen"></main></div><nav class="nav"><button id="nav-hoy" onclick="tab('hoy')">● Hoy</button><button id="nav-rutinas" onclick="tab('rutinas')">▦ Rutinas</button><button id="nav-progreso" onclick="tab('progreso')">↗ Progreso</button></nav><div class="toast" id="toast"></div>
<script>
"use strict";
const KEY="gym-voice-demo-2026";let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!db||!Array.isArray(db.sessions))db={sessions:[],routines:[]};if(!Array.isArray(db.routines))db.routines=[];
let page="hoy",mode="durante",draft=[],issues=[],original="",needConfirm=false,active=null;
const el=id=>document.getElementById(id), esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const notify=t=>{const e=el("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",3500)};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify("No se pudo guardar en este navegador");return false}};
const digit={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90};
const normal=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const numbers=s=>normal(s).replace(/\b(treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa)\s+y\s+(un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)\b/g,(_,a,b)=>digit[a]+digit[b]).replace(/\b[a-z]+\b/g,w=>digit[w]===undefined?w:String(digit[w]));
const catalog=[["press banca","press de banca","pres banca"],["remo con barra","remo barra"],["peso muerto","deadlift"],["sentadilla","sentadillas"],["curl de bíceps","curl de biceps","cool de biceps","curl biceps"],["press militar","press hombro"],["jalón al pecho","jalon pecho"],["dominadas","dominada"],["prensa","prensa de piernas"],["remo","remo"],["elevaciones laterales","elevaciones laterales"],["fondos","fondos"]];
function nameOf(s){const n=normal(s);let hits=[];for(const names of catalog)for(const a of names){const at=n.indexOf(normal(a));if(at>=0)hits.push({name:names[0],at,len:a.length})}hits.sort((a,b)=>a.at-b.at||b.len-a.len);if(hits.length)return hits[0].name;return s.replace(/^(hoy\s+)?(he hecho|hice|hago)\s+/,"").split(/\d/)[0].replace(/[,:;.\s]+$/,"").trim().slice(0,40)}
function parseOne(raw){let s=numbers(raw),name=nameOf(s),alerts=[];const countHit=s.match(/\b(\d{1,2})\s*series?\b/),count=countHit?Number(countHit[1]):0;
const multi=[...s.matchAll(/\b(\d{1,3})\s*(?:repeticiones?|reps?)?\s*(?:con|a)\s*(\d+(?:[.,]\d+)?)\s*(?:kg|kilos?)?\b/g)];
let sets=[];
if(multi.length>=2&&(!count||multi.length===count))sets=multi.map(m=>({reps:Number(m[1]),weight:Number(m[2].replace(",","."))}));
else {const w=s.match(/\b(\d+(?:[.,]\d+)?)\s*(kg|kilos?)\b/),weight=w?Number(w[1].replace(",",".")):null;
let remaining=s.replace(/\b\d+(?:[.,]\d+)?\s*(kg|kilos?)\b/g," ").replace(/\b\d+\s*series?\b/g," ").replace(/\b(?:descanso|pausa)\s*\d+\s*(?:minutos?|segundos?)?/g," ");
let reps=[...remaining.matchAll(/\b(\d{1,3})\b/g)].map(x=>Number(x[1]));
if(count&&reps.length===1)reps=Array(count).fill(reps[0]);
if(count&&!reps.length)reps=Array(count).fill(null);
sets=(reps.length?reps:[null]).slice(0,20).map(r=>({reps:r,weight}));}
if(!name)alerts.push("Ejercicio desconocido");if(count&&count!==sets.length)alerts.push("Se dictaron "+count+" series pero se reconocieron "+sets.length);
if(sets.some(x=>!x.reps))alerts.push("Faltan repeticiones");if(sets.some(x=>x.weight===null))alerts.push("Falta el peso");if(sets.some(x=>x.reps>40))alerts.push("Repeticiones sospechosas: Siri puede haber unido dos cifras");
return {name,sets,alerts};
}
function parse(text){const s=text.trim();if(!s)return {entries:[],alerts:["No hay dictado"]};
const parts=s.split(/\s*(?:[;.!]+|\b(?:despu[eé]s|luego|finalmente|por último|y he hecho|también he hecho)\b)\s*/i).map(x=>x.trim()).filter(Boolean);
const entries=parts.map(parseOne);return {entries,alerts:entries.flatMap((e,i)=>e.alerts.map(a=>(i+1)+". "+a))}}
function tab(t){page=t;render()}
function render(){["hoy","rutinas","progreso"].forEach(t=>el("nav-"+t).className=page===t?"on":"");el("screen").innerHTML=page==="hoy"?viewToday():page==="rutinas"?viewRoutines():viewProgress()}
function viewToday(){const ongoing=db.sessions.find(s=>!s.finished);let rows=ongoing?ongoing.entries:[];return '<h1>Tu entrenamiento</h1><p class="muted small">Registra cada ejercicio mientras entrenas o dicta todo al terminar.</p><div class="modes"><button class="'+(mode==="durante"?"on":"")+'" onclick="chooseMode(\'durante\')">Durante la sesión</button><button class="'+(mode==="final"?"on":"")+'" onclick="chooseMode(\'final\')">Todo al final</button></div><div class="card"><h2>🎙 Dictar entrenamiento</h2><textarea id="voice" placeholder="Remo con barra, tres series con 40 kilos, 10, 9 y 8 repeticiones">'+esc(original)+'</textarea><div class="actions"><button class="secondary" onclick="listen()">🎤 Hablar</button><button class="primary" onclick="interpret()">Interpretar dictado</button></div><p class="tiny">Con Siri: Atajo «Dictar texto» → «Codificar URL» → «Abrir URLs» con la URL de esta web más #voice= y el texto codificado.</p><button class="secondary" onclick="copyPrefix()">Copiar prefijo para Atajos</button></div>'+viewDraft()+'<div class="card"><div class="row"><h2>Sesión actual</h2>'+(ongoing?'<button class="secondary" onclick="finish()">Finalizar</button>':'<button class="secondary" onclick="start()">Iniciar sesión</button>')+'</div>'+(rows.length?rows.map(e=>'<div class="entry"><strong>'+esc(e.name)+'</strong><p class="muted small">'+esc(e.sets.map(s=>s.weight+' kg × '+s.reps).join(' · '))+'</p></div>').join(''):'<p class="muted small">Todavía no has registrado series.</p>')+'</div><p class="tiny">Demo temporal. Prueba con datos ficticios: el almacenamiento del navegador no está sincronizado ni protegido como una aplicación definitiva.</p>'}
function viewDraft(){if(!draft.length)return "";return '<div class="card"><h2>Revisa antes de guardar</h2>'+issues.map(i=>'<p class="warning">⚠ '+esc(i)+'</p>').join('')+draft.map((e,i)=>'<div class="entry"><label>Ejercicio '+(i+1)+'</label><input id="n'+i+'" value="'+esc(e.name)+'" oninput="changed()">'+e.sets.map((s,j)=>'<div class="set"><span class="tiny">Serie '+(j+1)+'</span><input id="r'+i+'_'+j+'" type="number" min="1" max="999" placeholder="Reps" value="'+(s.reps==null?"":esc(s.reps))+'" oninput="changed()"><input id="w'+i+'_'+j+'" type="number" min="0" max="999" step=".5" placeholder="kg" value="'+(s.weight==null?"":esc(s.weight))+'" oninput="changed()"></div>').join('')+'</div>').join('')+'<label class="check"><input type="checkbox" id="review" onchange="needConfirm=this.checked"> He comprobado los datos del dictado</label><div class="actions"><button class="secondary" onclick="discard()">Cancelar</button><button class="primary" onclick="saveDraft()">Guardar series</button></div></div>'}
function chooseMode(v){original=el("voice")?.value||"";mode=v;render()}
function start(){db.sessions.unshift({id:Date.now(),date:new Date().toISOString(),entries:[],finished:false});persist();render()}
function finish(){const s=db.sessions.find(s=>!s.finished);if(s){s.finished=true;persist()}render()}
function interpret(){original=el("voice")?.value||"";const p=parse(original);draft=p.entries;issues=p.alerts;needConfirm=false;render()}
function discard(){draft=[];issues=[];needConfirm=false;render()}
function changed(){needConfirm=false;const r=el("review");if(r)r.checked=false}
function saveDraft(){if(!el("review")?.checked){notify("Revisa los datos y marca la confirmación");return}const entries=draft.map((e,i)=>({name:el("n"+i).value.trim(),sets:e.sets.map((s,j)=>({reps:Number(el("r"+i+"_"+j).value),weight:el("w"+i+"_"+j).value===""?null:Number(el("w"+i+"_"+j).value)}))}));if(entries.some(e=>!e.name||e.sets.some(s=>!Number.isInteger(s.reps)||s.reps<1||s.reps>40||s.weight===null||!Number.isFinite(s.weight)||s.weight<0||s.weight>500))){notify("Corrige los campos incompletos o sospechosos");return}let session=db.sessions.find(s=>!s.finished);if(!session){session={id:Date.now(),date:new Date().toISOString(),entries:[],finished:false};db.sessions.unshift(session)}session.entries.push(...entries);if(mode==="final")session.finished=true;if(!persist())return;draft=[];issues=[];original="";render();notify("Entrenamiento guardado")}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify("Usa el Atajo Siri o el dictado del teclado");return}const r=new SR();r.lang="es-ES";r.onresult=e=>{el("voice").value=(el("voice").value+" "+e.results[0][0].transcript).trim()};r.onerror=()=>notify("El dictado del navegador no está disponible");r.start()}
function copyPrefix(){const url=location.href.split("#")[0]+"#voice=";if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>notify("Prefijo copiado")).catch(()=>notify("Copia la URL desde Safari"));else notify("Copia la URL desde Safari")}
function viewRoutines(){return '<h1>Rutinas</h1><p class="muted small">Guarda el plan como lo dirías hablando. En esta prueba solo se guarda el texto: no genera todavía series automáticamente.</p><div class="card"><h2>Nueva rutina</h2><input id="routineName" placeholder="Ej.: Torso A"><label>Ejercicios y descansos</label><textarea id="routineText" placeholder="Press banca 3x8-12, descanso 2 minutos. Remo 3x10..."></textarea><button class="primary wide heading" onclick="saveRoutine()">Guardar rutina</button></div>'+(!db.routines.length?'<div class="empty">Todavía no tienes rutinas.</div>':db.routines.map((r,i)=>'<div class="card"><div class="row"><h2>'+esc(r.name)+'</h2><button class="secondary" onclick="deleteRoutine('+i+')">Eliminar</button></div><p class="muted small">'+esc(r.text)+'</p><button class="secondary" onclick="useRoutine('+i+')">Usar como referencia</button></div>').join(''))}
function saveRoutine(){const name=el("routineName").value.trim(),text=el("routineText").value.trim();if(!name||!text){notify("Indica nombre y ejercicios");return}db.routines.push({name,text});persist();render();notify("Rutina guardada")}
function deleteRoutine(i){if(confirm("¿Eliminar esta rutina?")){db.routines.splice(i,1);persist();render()}}
function useRoutine(i){page="hoy";render();notify("Rutina: "+db.routines[i].name)}
function viewProgress(){const all=db.sessions.flatMap(s=>s.entries.map(e=>({...e,date:s.date})));const count=all.reduce((n,e)=>n+e.sets.length,0);const exercises=[...new Set(all.map(e=>e.name))].sort();return '<h1>Progreso</h1><p class="muted small">'+db.sessions.length+' sesiones · '+count+' series guardadas</p><div class="card"><h2>Evolución por ejercicio</h2>'+(!exercises.length?'<div class="empty">Registra tu primera sesión para ver la evolución.</div>':exercises.map(name=>{const entries=all.filter(e=>e.name===name).reverse();const max=Math.max(1,...entries.flatMap(e=>e.sets.map(s=>s.weight)));return '<div class="entry"><strong>'+esc(name)+'</strong>'+entries.slice(-8).map(e=>{const top=Math.max(...e.sets.map(s=>s.weight));return '<div class="small muted">'+new Date(e.date).toLocaleDateString("es-ES")+' · '+top+' kg · '+e.sets.map(s=>s.reps).join("/")+' reps<div class="bar" style="width:'+Math.max(2,Math.round(top/max*100))+'%"></div></div>'}).join('')+'</div>'}).join(''))+'</div><button class="secondary wide" onclick="exportData()">Exportar copia JSON</button><p class="tiny">El peso máximo no es una estimación de fuerza. Los datos están solo en el navegador que uses.</p>'}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="gym-voice-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importHash(){if(!location.hash.startsWith("#voice="))return;try{original=decodeURIComponent(location.hash.slice(7).replace(/\+/g,"%20"));page="hoy";history.replaceState(null,"",location.href.split("#")[0]);const p=parse(original);draft=p.entries;issues=p.alerts;needConfirm=false}catch(e){notify("No se pudo interpretar el enlace")}}
window.addEventListener("hashchange",()=>{importHash();render()});importHash();render();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
